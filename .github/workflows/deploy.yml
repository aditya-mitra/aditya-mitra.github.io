# Builds the site with bun on every push to main, then publishes dist/ two ways:
# - GitHub Pages: pushed to the gh-pages branch (Settings > Pages > Source = "Deploy from a branch", gh-pages, /).
# - Netlify: aditya-mitra.netlify.app, using the NETLIFY_AUTH_TOKEN_V2 and NETLIFY_SITE_ID_V2 secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      # Jekyll would drop Astro's _astro/ folder.
      - run: touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true

  github_pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The deploy action pushes from a git checkout of this repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true

  netlify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: dist
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploying at aditya-mitra.netlify.app - ${{ github.event.head_commit.message }}'
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_V2 }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_V2 }}
        timeout-minutes: 5
